[project]
name = "skillsandagents"
version = "0.1.0"
description = "A collection of AI agent skills (Agent Skills open standard) and LangChain-compatible Python tools for major coding agents including OpenCode, Claude Code, Cursor, OpenAI Codex, and more."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
tools = [
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
